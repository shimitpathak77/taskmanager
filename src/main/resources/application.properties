spring.application.name=taskmanager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:7016}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET:thisIsAVeryLongSecretKeyForJWTThatShouldBeAtLeast256BitsLong}
jwt.expiration=${JWT_EXPIRATION:86400000}
